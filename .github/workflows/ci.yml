name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSL -o gl.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tar.gz" | sha256sum -c -
          tar -xzf gl.tar.gz gitleaks
      - name: gitleaks (full history, all branches) - any finding fails the build
        run: ./gitleaks git --redact --config .gitleaks.toml --exit-code 1 --log-opts="--all" -v .
      - name: gitleaks (working tree)
        run: ./gitleaks dir --redact --config .gitleaks.toml --exit-code 1 .
      - name: CROMO secret and privacy scan
        run: python3 scripts/secret_scan.py --all

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend eval scripts --select E,F,W --ignore E501
      - run: cd backend && python -m pytest -q tests
      - run: pip-audit -r backend/requirements.txt
      - name: archive generator is reproducible
        run: |
          python generator/build_archive.py
          git diff --exit-code --stat -- archive/plant eval/ground_truth.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm ci --no-audit --no-fund && npm run build
      - run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: production bundle has no source maps and no secrets
        run: |
          test -z "$(find frontend/dist -name '*.map')"
          curl -sSL -o gl.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tar.gz" | sha256sum -c -
          tar -xzf gl.tar.gz gitleaks
          ./gitleaks dir --redact --exit-code 1 frontend/dist
          ! grep -rEo "https?://(localhost|127\.0\.0\.1|[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)" frontend/dist/assets

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target app -t cromo:ci .
      - name: container starts and is healthy
        run: |
          docker run -d --name cromo -p 8000:8000 cromo:ci
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health && break; sleep 2; done
          curl -sf localhost:8000/api/map | head -c 300
          docker exec cromo id -u | grep -v '^0$'
